# Local read-only Postgres for integration testing.
# Usage:
#   docker compose up -d
#   export DATABASE_URL=postgres://readonly:readonly@localhost:5434/boundary
#   npm run test:integration

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: boundary
    volumes:
      - ./scripts/init-readonly.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d boundary"]
      interval: 2s
      timeout: 5s
      retries: 10
